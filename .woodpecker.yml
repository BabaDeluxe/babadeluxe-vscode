skip_clone: true

variables:
  - &release_image node:20-alpine

  - &release_commands
    - set -euo pipefail
    - apk add --no-cache git bash curl
    - |
      set -euo pipefail
      [ -n "$GH_TOKEN" ]     || { echo "FAIL: GH_TOKEN is not set";     exit 1; }
      [ -n "$VSCE_PAT" ]     || { echo "FAIL: VSCE_PAT is not set";     exit 1; }
      [ -n "$REPO_BRANCH" ]  || { echo "FAIL: REPO_BRANCH is not set";  exit 1; }
      [ -n "$REPO_SLUG" ]    || { echo "FAIL: REPO_SLUG is not set";    exit 1; }
      [ -n "$REPO_DIR" ]     || { echo "FAIL: REPO_DIR is not set";     exit 1; }
      [ -n "$PNPM_VERSION" ] || { echo "FAIL: PNPM_VERSION is not set"; exit 1; }
    - corepack enable
    - corepack use "pnpm@$PNPM_VERSION"
    - |
      set -euo pipefail
      askpass=$(mktemp)
      printf '#!/bin/sh\necho "%s"\n' "$GH_TOKEN" > "$askpass"
      chmod +x "$askpass"
      GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$askpass" GIT_USERNAME="x-access-token" \
        git clone --no-recurse-submodules "https://github.com/$REPO_SLUG.git" "$REPO_DIR" -b "$REPO_BRANCH"
      rm -f "$askpass"
    - |
      set -euo pipefail
      cd "$REPO_DIR"
      git config --local user.email "ci@babadeluxe.com"
      git config --local user.name "BabaDeluxe CI"
      askpass=$(mktemp)
      printf '#!/bin/sh\necho "%s"\n' "$GH_TOKEN" > "$askpass"
      chmod +x "$askpass"
      GIT_ASKPASS="$askpass" GIT_USERNAME="x-access-token" \
        git remote set-url origin "https://github.com/$REPO_SLUG.git"
      rm -f "$askpass"
      HUSKY=0 pnpm install --frozen-lockfile
      pnpm type-check
      pnpm build
      pnpm test --run
      printf 'GH_TOKEN=%s\nVSCE_PAT=%s\n' "$GH_TOKEN" "$VSCE_PAT" > .env
      pnpm release

steps:
  release:
    image: *release_image
    when:
      - event: [push, manual]
        branch: master
    environment:
      GH_TOKEN:
        from_secret: gh_token
      VSCE_PAT:
        from_secret: vsce_pat
      REPO_SLUG: BabaDeluxe/babadeluxe-vscode
      PNPM_VERSION: 9.15.0
      REPO_BRANCH: master
      REPO_DIR: /tmp/babadeluxe-vscode
    commands: *release_commands
